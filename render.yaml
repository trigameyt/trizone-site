services:
  - type: web
    name: trizone-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_ROLE_COPPER_ID
        sync: false
      - key: DISCORD_ROLE_IRON_ID
        sync: false
      - key: DISCORD_ROLE_GOLD_ID
        sync: false
      - key: DISCORD_ROLE_DIAMOND_ID
        sync: false
      - key: DISCORD_ROLE_NETHERITE_ID
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DATABASE_SSL_CA
        sync: false
      - key: STRIPE_API_VERSION
        value: 2025-03-31.basil
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_COPPER_ID
        sync: false
      - key: STRIPE_PRICE_IRON_ID
        sync: false
      - key: STRIPE_PRICE_GOLD_ID
        sync: false
      - key: STRIPE_PRICE_DIAMOND_ID
        sync: false
      - key: STRIPE_PRICE_NETHERITE_ID
        sync: false
      - key: MINECRAFT_LINK_SECRET
        sync: false
      - key: CALAGOPUS_PANEL_URL
        sync: false
      - key: CALAGOPUS_STATUS_API_KEY
        sync: false
      - key: CALAGOPUS_ADMIN_API_KEY
        sync: false
      - key: CALAGOPUS_PROXY_ID
        sync: false
      - key: CALAGOPUS_WARZONE_ID
        sync: false
      - key: CALAGOPUS_SPAWN_ID
        sync: false
      - key: CALAGOPUS_MINIGAME_ID
        sync: false
      - key: CALAGOPUS_AUTH_ID
        sync: false
