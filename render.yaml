services:
  - type: web
    name: trizone-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: TEBEX_WEBSTORE_TOKEN
        sync: false
      - key: TEBEX_WEBHOOK_SECRET
        sync: false
      - key: MINECRAFT_LINK_SECRET
        sync: false
      - key: PTERODACTYL_PANEL_URL
        sync: false
      - key: PTERODACTYL_API_KEY
        sync: false
      - key: PTERODACTYL_SERVER_ID
        sync: false
      - key: PTERODACTYL_SERVER_LABEL
        value: "Proxy"
