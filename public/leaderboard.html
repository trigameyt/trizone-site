<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Leaderboard Duels — Trizone</title><meta name="theme-color" content="#0b0710">
  <link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/style.css?v=4160"><link rel="stylesheet" href="/tournament-profile.css?v=1">
  <script defer src="/components.js?v=4151"></script><script defer src="/common.js?v=4151"></script><script defer src="/duel-charts.js?v=4160"></script><script defer src="/leaderboard.js?v=4151"></script><script defer src="/tournament-profile.js?v=1"></script>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="page-head"><div class="container"><p class="eyebrow">Duels Trizone</p><h1>Leaderboard</h1><p>Classement général et par kit. Avant 10 matchs, tu apparais en UNRANKED avec ta progression de placement ; ton ELO n’est affiché qu’une fois classé.</p></div></section>
    <section class="section compact"><div class="container leaderboard-shell">
      <div id="leaderboard-tabs" class="leaderboard-tabs"><span class="muted">Chargement des kits…</span></div>
      <div class="leaderboard-toolbar"><div><b id="leaderboard-title">Overall</b><small id="leaderboard-subtitle">10 matchs de placement requis</small></div><input class="search-input" id="leaderboard-search" placeholder="Chercher un joueur…" autocomplete="off"></div>
      <div id="leaderboard-root" class="leaderboard-list"><div class="skeleton"></div></div>
    </div></section>
  </main>
  <div id="site-footer"></div>
  <div id="duel-profile-modal" class="duel-profile-modal" hidden aria-hidden="true">
    <div class="duel-profile-backdrop" data-close-profile="1"></div>
    <section class="duel-profile-dialog" role="dialog" aria-modal="true" aria-label="Profil Duels du joueur">
      <button id="duel-profile-close" class="duel-profile-close" type="button" aria-label="Fermer">×</button>
      <div id="duel-profile-body"><div class="skeleton"></div></div>
    </section>
  </div>
</body></html>
