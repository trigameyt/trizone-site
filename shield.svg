<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Minecraft-like GUI shield: slightly rotated 3D face -->
  <!-- rear thickness -->
  <path d="M7 7h2v17H7z" fill="#4a4a4a"/>
  <path d="M9 24h2v2H9z" fill="#3b3b3b"/>

  <!-- outer metal rim -->
