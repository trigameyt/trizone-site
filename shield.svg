  <!-- metal highlights / shadows -->
  <path d="M10 4h11v2H10zM9 6h2v17H9zM11 24h2v2h-2z" fill="#b7b7b7"/>
  <path d="M22 7h2v2h-2zM24 9h2v11h-2zM22 20h2v4h-2zM19 24h3v3h-3zM14 27h5v2h-5z" fill="#565656"/>

  <!-- wooden face -->
  <path d="M11 7h11v2h2v10h-2v4h-3v3h-6v-2h-2z" fill="#8a5524"/>
  <path d="M11 7h3v17h-3z" fill="#a96b2d"/>
  <path d="M14 7h3v19h-3z" fill="#7e491d"/>
  <path d="M17 7h3v18h-3z" fill="#9c5c23"/>
  <path d="M20 9h2v14h-2z" fill="#744019"/>
  <!-- plank highlights -->
  <path d="M12 9h1v5h-1zM15 8h1v7h-1zM18 10h1v6h-1zM21 11h1v5h-1z" fill="#ba7631"/>
  <!-- rivets -->
  <rect x="10" y="8" width="2" height="2" fill="#c3c3c3"/>
  <rect x="21" y="9" width="2" height="2" fill="#8d8d8d"/>
  <rect x="10" y="18" width="2" height="2" fill="#a4a4a4"/>
  <rect x="20" y="19" width="2" height="2" fill="#747474"/>
  <!-- subtle lower edge -->
  <rect x="13" y="25" width="6" height="1" fill="#654018"/>
</svg>
